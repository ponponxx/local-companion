<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">A normal foreground turn</title><desc id="desc">Two main local-model calls; response analysis and maintenance are separate work.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="760" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">A normal foreground turn</text><text x="40" y="80" font-size="15" fill="#566879">Two main local-model calls; response analysis and maintenance are separate work.</text><polyline points="290,175 360,175" fill="none" stroke="#657484" stroke-width="2"/><polygon points="360.0,175.0 351.0,171.0 351.0,179.0" fill="#657484"/><polyline points="610,175 680,175" fill="none" stroke="#657484" stroke-width="2"/><polygon points="680.0,175.0 671.0,171.0 671.0,179.0" fill="#657484"/><polyline points="805,230 805,310" fill="none" stroke="#657484" stroke-width="2"/><polygon points="805.0,310.0 809.0,301.0 801.0,301.0" fill="#657484"/><polyline points="680,365 610,365" fill="none" stroke="#657484" stroke-width="2"/><polygon points="610.0,365.0 619.0,369.0 619.0,361.0" fill="#657484"/><polyline points="360,365 290,365" fill="none" stroke="#657484" stroke-width="2"/><polygon points="290.0,365.0 299.0,369.0 299.0,361.0" fill="#657484"/><polyline points="165,420 165,505" fill="none" stroke="#657484" stroke-width="2"/><polygon points="165.0,505.0 169.0,496.0 161.0,496.0" fill="#657484"/><polyline points="290,560 360,560" fill="none" stroke="#657484" stroke-width="2"/><polygon points="360.0,560.0 351.0,556.0 351.0,564.0" fill="#657484"/><rect x="304.0" y="532" width="44" height="20" rx="3" fill="#f8fafc"/><text x="326" y="547" text-anchor="middle" font-size="13" fill="#455967">sent</text><polyline points="700,560 790,560" fill="none" stroke="#657484" stroke-width="2"/><polygon points="790.0,560.0 781.0,556.0 781.0,564.0" fill="#657484"/><rect x="40" y="120" width="250" height="110" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="58" y="150" font-size="18" font-weight="700" fill="#172b3a">Telegram inbox</text><text x="58" y="176" font-size="14" fill="#354c5b">Batch adjacent text</text><text x="58" y="199" font-size="14" fill="#354c5b">10-second quiet window</text><rect x="360" y="120" width="250" height="110" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="378" y="150" font-size="18" font-weight="700" fill="#172b3a">Snapshot + recall</text><text x="378" y="176" font-size="14" fill="#354c5b">Current time / state</text><text x="378" y="199" font-size="14" fill="#354c5b">Relevant memory candidates</text><rect x="680" y="120" width="250" height="110" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="698" y="150" font-size="18" font-weight="700" fill="#172b3a">User Observer</text><text x="698" y="176" font-size="14" fill="#354c5b">Propose events, intent</text><text x="698" y="199" font-size="14" fill="#354c5b">and supported appraisals</text><rect x="680" y="310" width="250" height="110" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="698" y="340" font-size="18" font-weight="700" fill="#172b3a">Validate + decide</text><text x="698" y="366" font-size="14" fill="#354c5b">Reduce accepted changes</text><text x="698" y="389" font-size="14" fill="#354c5b">Select an action / goal</text><rect x="360" y="310" width="250" height="110" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="378" y="340" font-size="18" font-weight="700" fill="#172b3a">Delivery + Editor</text><text x="378" y="366" font-size="14" fill="#354c5b">Wording lookup + context</text><text x="378" y="389" font-size="14" fill="#354c5b">Assemble final messages</text><rect x="40" y="310" width="250" height="110" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="58" y="340" font-size="18" font-weight="700" fill="#172b3a">Writer</text><text x="58" y="366" font-size="14" fill="#354c5b">Phrase selected action</text><text x="58" y="389" font-size="14" fill="#354c5b">No new action selection</text><rect x="40" y="505" width="250" height="110" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="58" y="535" font-size="18" font-weight="700" fill="#172b3a">Telegram delivery</text><text x="58" y="561" font-size="14" fill="#354c5b">Save delivery checkpoint</text><text x="58" y="584" font-size="14" fill="#354c5b">Send the character reply</text><rect x="360" y="505" width="340" height="110" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="378" y="535" font-size="18" font-weight="700" fill="#172b3a">Deferred response analysis</text><text x="378" y="561" font-size="14" fill="#354c5b">Interpret actual character reply</text><text x="378" y="584" font-size="14" fill="#354c5b">Validate before committing changes</text><rect x="790" y="505" width="370" height="110" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="808" y="535" font-size="18" font-weight="700" fill="#172b3a">Memory / state maintenance</text><text x="808" y="561" font-size="14" fill="#354c5b">Store originals and verified updates</text><text x="808" y="584" font-size="14" fill="#354c5b">Compact history / warm retrieval</text><text x="40" y="665" font-size="14" fill="#566879">The Observer output is a proposal. The reply is not a verified state change until response analysis accepts it.</text><text x="40" y="694" font-size="14" fill="#566879">The primary Telegram path defers normal response analysis. Photo / workbench paths and optional tools may differ.</text><text x="40" y="723" font-size="14" fill="#566879">Diagnostics record calls and outcomes; the read-only inspector is not part of the decision loop.</text></g></svg>