<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="735" viewBox="0 0 1240 735" role="img" aria-labelledby="title desc"><title id="title">Six cores, one reply</title><desc id="desc">Logical responsibilities mapped onto the current implementation. Not six separate models.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="735" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">Six cores, one reply</text><text x="40" y="80" font-size="15" fill="#566879">Logical responsibilities mapped onto the current implementation. Not six separate models.</text><polyline points="310,181 360,181" fill="none" stroke="#657484" stroke-width="2"/><polygon points="360.0,181.0 351.0,177.0 351.0,185.0" fill="#657484"/><rect x="299.0" y="154" width="72" height="20" rx="3" fill="#f8fafc"/><text x="335" y="169" text-anchor="middle" font-size="13" fill="#455967">validate</text><polyline points="630,181 680,181" fill="none" stroke="#657484" stroke-width="2"/><polygon points="680.0,181.0 671.0,177.0 671.0,185.0" fill="#657484"/><polyline points="1000,181 950,181" fill="none" stroke="#657484" stroke-width="2"/><polygon points="950.0,181.0 959.0,185.0 959.0,177.0" fill="#657484"/><polyline points="815,237 815,305" fill="none" stroke="#657484" stroke-width="2"/><polygon points="815.0,305.0 819.0,296.0 811.0,296.0" fill="#657484"/><polyline points="310,361 545,361 545,490" fill="none" stroke="#657484" stroke-width="2"/><polygon points="545.0,490.0 549.0,481.0 541.0,481.0" fill="#657484"/><rect x="381.5" y="333" width="121" height="20" rx="3" fill="#f8fafc"/><text x="442" y="348" text-anchor="middle" font-size="13" fill="#455967">selected memory</text><polyline points="815,417 815,450 650,450 650,490" fill="none" stroke="#657484" stroke-width="2"/><polygon points="650.0,490.0 654.0,481.0 646.0,481.0" fill="#657484"/><rect x="678.0" y="426" width="44" height="20" rx="3" fill="#f8fafc"/><text x="700" y="441" text-anchor="middle" font-size="13" fill="#455967">tone</text><polyline points="950,181 975,181 975,470 715,470 715,490" fill="none" stroke="#657484" stroke-width="2"/><polygon points="715.0,490.0 719.0,481.0 711.0,481.0" fill="#657484"/><rect x="833.5" y="445" width="93" height="20" rx="3" fill="#f8fafc"/><text x="880" y="460" text-anchor="middle" font-size="13" fill="#455967">action plan</text><polyline points="495,237 495,267 365,267 365,490" fill="none" stroke="#657484" stroke-width="2"/><polygon points="365.0,490.0 369.0,481.0 361.0,481.0" fill="#657484"/><rect x="335.5" y="277" width="107" height="20" rx="3" fill="#f8fafc"/><text x="389" y="292" text-anchor="middle" font-size="13" fill="#455967">current facts</text><polyline points="730,552 820,552" fill="none" stroke="#657484" stroke-width="2"/><polygon points="820.0,552.0 811.0,548.0 811.0,556.0" fill="#657484"/><rect x="40" y="125" width="270" height="112" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="58" y="155" font-size="18" font-weight="700" fill="#172b3a">1  Observer</text><text x="58" y="181" font-size="14" fill="#354c5b">Text + current context</text><text x="58" y="204" font-size="14" fill="#354c5b">→ proposed events / intent</text><rect x="360" y="125" width="270" height="112" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="378" y="155" font-size="18" font-weight="700" fill="#172b3a">State reducer</text><text x="378" y="181" font-size="14" fill="#354c5b">Evidence and actor checks</text><text x="378" y="204" font-size="14" fill="#354c5b">→ accepted state changes</text><rect x="680" y="125" width="270" height="112" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="698" y="155" font-size="18" font-weight="700" fill="#172b3a">2  Decision core</text><text x="698" y="181" font-size="14" fill="#354c5b">State + accepted events</text><text x="698" y="204" font-size="14" fill="#354c5b">→ selected action / goal</text><rect x="680" y="305" width="270" height="112" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="698" y="335" font-size="18" font-weight="700" fill="#172b3a">3  Delivery core</text><text x="698" y="361" font-size="14" fill="#354c5b">Traits + relationship + state</text><text x="698" y="384" font-size="14" fill="#354c5b">→ wording instructions</text><rect x="40" y="305" width="270" height="112" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="58" y="335" font-size="18" font-weight="700" fill="#172b3a">4  StoryCore</text><text x="58" y="361" font-size="14" fill="#354c5b">Sourced dialogue / notes</text><text x="58" y="384" font-size="14" fill="#354c5b">→ selected story_context</text><rect x="360" y="490" width="370" height="125" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="378" y="520" font-size="18" font-weight="700" fill="#172b3a">5  Editor / context assembly</text><text x="378" y="546" font-size="14" fill="#354c5b">Facts + plan + tone + memory</text><text x="378" y="569" font-size="14" fill="#354c5b">Token budget / source projection</text><text x="378" y="592" font-size="14" fill="#354c5b">→ final messages</text><rect x="820" y="490" width="270" height="125" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="838" y="520" font-size="18" font-weight="700" fill="#172b3a">6  Writer</text><text x="838" y="546" font-size="14" fill="#354c5b">Final messages</text><text x="838" y="569" font-size="14" fill="#354c5b">→ character reply</text><rect x="1000" y="125" width="200" height="112" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="1018" y="155" font-size="18" font-weight="700" fill="#172b3a">Current state</text><text x="1018" y="181" font-size="14" fill="#354c5b">Scenes / outfits</text><text x="1018" y="204" font-size="14" fill="#354c5b">Needs / emotion</text><text x="40" y="655" font-size="14" fill="#566879">Blue = local model call     Green = Python rules / assembly     Amber = persistent state</text><text x="40" y="685" font-size="14" fill="#566879">State validates facts. Decision selects actions. Delivery adjusts wording. Writer can still make semantic errors.</text></g></svg>