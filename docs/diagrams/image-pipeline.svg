<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="895" viewBox="0 0 1240 895" role="img" aria-labelledby="title desc"><title id="title">Context-aware character photos</title><desc id="desc">Recommended route: /photo → controlled visual planning → local image generation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="895" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">Context-aware character photos</text><text x="40" y="80" font-size="15" fill="#566879">Recommended route: /photo → controlled visual planning → local image generation.</text><polyline points="320,182 400,182" fill="none" stroke="#657484" stroke-width="2"/><polygon points="400.0,182.0 391.0,178.0 391.0,186.0" fill="#657484"/><polyline points="320,357 400,357" fill="none" stroke="#657484" stroke-width="2"/><polygon points="400.0,357.0 391.0,353.0 391.0,361.0" fill="#657484"/><polyline points="560,240 560,300" fill="none" stroke="#657484" stroke-width="2"/><polygon points="560.0,300.0 564.0,291.0 556.0,291.0" fill="#657484"/><polyline points="720,182 780,182 780,275 820,275" fill="none" stroke="#657484" stroke-width="2"/><polygon points="820.0,275.0 811.0,271.0 811.0,279.0" fill="#657484"/><rect x="752.5" y="193" width="51" height="20" rx="3" fill="#f8fafc"/><text x="778" y="208" text-anchor="middle" font-size="13" fill="#455967">facts</text><polyline points="720,357 820,357" fill="none" stroke="#657484" stroke-width="2"/><polygon points="820.0,357.0 811.0,353.0 811.0,361.0" fill="#657484"/><rect x="735.5" y="327" width="65" height="20" rx="3" fill="#f8fafc"/><text x="768" y="342" text-anchor="middle" font-size="13" fill="#455967">staging</text><polyline points="990,385 990,495" fill="none" stroke="#657484" stroke-width="2"/><polygon points="990.0,495.0 994.0,486.0 986.0,486.0" fill="#657484"/><rect x="1003.0" y="425" width="100" height="20" rx="3" fill="#f8fafc"/><text x="1053" y="440" text-anchor="middle" font-size="13" fill="#455967">exact prompt</text><polyline points="820,552 720,552" fill="none" stroke="#657484" stroke-width="2"/><polygon points="720.0,552.0 729.0,556.0 729.0,548.0" fill="#657484"/><polyline points="400,552 320,552" fill="none" stroke="#657484" stroke-width="2"/><polygon points="320.0,552.0 329.0,556.0 329.0,548.0" fill="#657484"/><rect x="40" y="125" width="280" height="115" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="58" y="155" font-size="18" font-weight="700" fill="#172b3a">Current formal state</text><text x="58" y="181" font-size="14" fill="#354c5b">Fixed appearance / current outfit</text><text x="58" y="204" font-size="14" fill="#354c5b">Hair, makeup, jewelry and gear</text><text x="58" y="227" font-size="14" fill="#354c5b">Character location / local time</text><rect x="40" y="300" width="280" height="115" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="58" y="330" font-size="18" font-weight="700" fill="#172b3a">This photo request</text><text x="58" y="356" font-size="14" fill="#354c5b">Expression / angle / shot size</text><text x="58" y="379" font-size="14" fill="#354c5b">Photo-only clothing instructions</text><text x="58" y="402" font-size="14" fill="#354c5b">Fresh same-place prop sources</text><rect x="400" y="125" width="320" height="115" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="418" y="155" font-size="18" font-weight="700" fill="#172b3a">Freeze visual snapshot</text><text x="418" y="181" font-size="14" fill="#354c5b">Program-owned appearance</text><text x="418" y="204" font-size="14" fill="#354c5b">Registered background + lighting</text><text x="418" y="227" font-size="14" fill="#354c5b">Recent source-bounded dialogue</text><rect x="400" y="300" width="320" height="115" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="418" y="330" font-size="18" font-weight="700" fill="#172b3a">Visual planner · local LLM</text><text x="418" y="356" font-size="14" fill="#354c5b">Expression / posture enums</text><text x="418" y="379" font-size="14" fill="#354c5b">View direction / camera height</text><text x="418" y="402" font-size="14" fill="#354c5b">Proposed props and photo overrides</text><rect x="820" y="235" width="340" height="150" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="838" y="265" font-size="18" font-weight="700" fill="#172b3a">Python prompt composer</text><text x="838" y="291" font-size="14" fill="#354c5b">Reapply current appearance</text><text x="838" y="314" font-size="14" fill="#354c5b">Validate photo-only changes / props</text><text x="838" y="337" font-size="14" fill="#354c5b">Select framing from this request</text><text x="838" y="360" font-size="14" fill="#354c5b">Join named sections once</text><rect x="820" y="495" width="340" height="115" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="838" y="525" font-size="18" font-weight="700" fill="#172b3a">Durable image job</text><text x="838" y="551" font-size="14" fill="#354c5b">Store exact final prompt</text><text x="838" y="574" font-size="14" fill="#354c5b">One image worker at a time</text><text x="838" y="597" font-size="14" fill="#354c5b">No implicit world-state mutation</text><rect x="400" y="495" width="320" height="115" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="418" y="525" font-size="18" font-weight="700" fill="#172b3a">MFLUX → Z-Image Turbo</text><text x="418" y="551" font-size="14" fill="#354c5b">Separate short-lived process</text><text x="418" y="574" font-size="14" fill="#354c5b">Own text encoder and VAE</text><text x="418" y="597" font-size="14" fill="#354c5b">Image pixels, not chat text</text><rect x="40" y="495" width="280" height="115" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="58" y="525" font-size="18" font-weight="700" fill="#172b3a">Telegram delivery</text><text x="58" y="551" font-size="14" fill="#354c5b">Upload photo</text><text x="58" y="574" font-size="14" fill="#354c5b">Save inspectable final prompt</text><text x="58" y="597" font-size="14" fill="#354c5b">Clean up temporary image</text><text x="40" y="665" font-size="14" fill="#566879">Blue = model execution. The visual planner still uses the chat model; the final composer is Python.</text><text x="40" y="697" font-size="14" fill="#566879">Natural-language photo requests first traverse normal dialogue, then join this visual route.</text><text x="40" y="729" font-size="14" fill="#566879">/image is a direct-prompt route; /selfie uses a simpler portrait prefix. Neither is identical to /photo.</text><text x="40" y="776" font-size="14" fill="#566879">Persistent clothing is edited through /settings or /outfit. Validated /photo wardrobe changes affect this shot only.</text><text x="40" y="816" font-size="14" fill="#566879">Image weights, text encoder and VAE belong to the image runtime. The chat 9B is not its text encoder.</text><text x="40" y="853" font-size="14" fill="#566879">No new image generation or private conversation replay was used to create this documentation.</text></g></svg>