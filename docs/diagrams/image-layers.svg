<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc"><title id="title">Who owns each part of the image prompt?</title><desc id="desc">Prompt continuity comes from structured state plus a bounded per-shot plan, not a face-lock model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="800" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">Who owns each part of the image prompt?</text><text x="40" y="80" font-size="15" fill="#566879">Prompt continuity comes from structured state plus a bounded per-shot plan, not a face-lock model.</text><polyline points="215,315 215,375 390,375 390,440" fill="none" stroke="#657484" stroke-width="2"/><polygon points="390.0,440.0 394.0,431.0 386.0,431.0" fill="#657484"/><polyline points="620,315 620,440" fill="none" stroke="#657484" stroke-width="2"/><polygon points="620.0,440.0 624.0,431.0 616.0,431.0" fill="#657484"/><polyline points="1025,315 1025,375 850,375 850,440" fill="none" stroke="#657484" stroke-width="2"/><polygon points="850.0,440.0 854.0,431.0 846.0,431.0" fill="#657484"/><rect x="40" y="130" width="350" height="185" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="58" y="160" font-size="18" font-weight="700" fill="#172b3a">A  Character appearance</text><text x="58" y="186" font-size="14" fill="#354c5b">Fixed identity description</text><text x="58" y="209" font-size="14" fill="#354c5b">Current clothing slots</text><text x="58" y="232" font-size="14" fill="#354c5b">Hair and makeup</text><text x="58" y="255" font-size="14" fill="#354c5b">Jewelry separate from carried gear</text><text x="58" y="278" font-size="14" fill="#354c5b">Program-owned snapshot</text><rect x="445" y="130" width="350" height="185" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="463" y="160" font-size="18" font-weight="700" fill="#172b3a">B  This shot</text><text x="463" y="186" font-size="14" fill="#354c5b">Expression and posture choices</text><text x="463" y="209" font-size="14" fill="#354c5b">Camera direction / height</text><text x="463" y="232" font-size="14" fill="#354c5b">Source-supported props</text><text x="463" y="255" font-size="14" fill="#354c5b">Validated photo-only wardrobe</text><text x="463" y="278" font-size="14" fill="#354c5b">Local planner + Python checks</text><rect x="850" y="130" width="350" height="185" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="868" y="160" font-size="18" font-weight="700" fill="#172b3a">C  World and camera policy</text><text x="868" y="186" font-size="14" fill="#354c5b">Registered scene geometry</text><text x="868" y="209" font-size="14" fill="#354c5b">Time-of-day lighting</text><text x="868" y="232" font-size="14" fill="#354c5b">User-viewer versus environment POV</text><text x="868" y="255" font-size="14" fill="#354c5b">Explicit shot size if requested</text><text x="868" y="278" font-size="14" fill="#354c5b">Program-owned composition</text><rect x="260" y="440" width="720" height="150" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="278" y="470" font-size="18" font-weight="700" fill="#172b3a">One final prompt</text><text x="278" y="496" font-size="14" fill="#354c5b">Fixed appearance → clothing → jewelry / gear → hair / makeup</text><text x="278" y="519" font-size="14" fill="#354c5b">Expression → pose → props → background → time / lighting → camera</text><text x="278" y="542" font-size="14" fill="#354c5b">Optional sections appear only when relevant; the raw request is not pasted as a story.</text><text x="278" y="565" font-size="14" fill="#354c5b">Different image modes can omit the character entirely.</text><text x="40" y="650" font-size="14" fill="#566879">Current facts beat stale narration. An explicitly removed item is different from an unknown clothing slot.</text><text x="40" y="682" font-size="14" fill="#566879">A prop staged for a photo is not evidence that a story action happened. A proposed outfit is not persistent state.</text><text x="40" y="714" font-size="14" fill="#566879">No automatic half-body framing is added for /photo when the request does not specify shot size.</text><text x="40" y="755" font-size="14" fill="#566879">This is prompt-based consistency. There is no reference-photo conditioning, face-lock or ControlNet guarantee.</text></g></svg>