<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-labelledby="title desc"><title id="title">Past context and fictional life are different</title><desc id="desc">StoryCore supplies context. The life subsystem advances authored fiction under explicit gates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="740" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">Past context and fictional life are different</text><text x="40" y="80" font-size="15" fill="#566879">StoryCore supplies context. The life subsystem advances authored fiction under explicit gates.</text><polyline points="340,187 420,187" fill="none" stroke="#657484" stroke-width="2"/><polygon points="420.0,187.0 411.0,183.0 411.0,191.0" fill="#657484"/><rect x="351.0" y="160" width="58" height="20" rx="3" fill="#f8fafc"/><text x="380" y="175" text-anchor="middle" font-size="13" fill="#455967">recall</text><polyline points="720,187 820,187" fill="none" stroke="#657484" stroke-width="2"/><polygon points="820.0,187.0 811.0,183.0 811.0,191.0" fill="#657484"/><polyline points="340,422 420,422" fill="none" stroke="#657484" stroke-width="2"/><polygon points="420.0,422.0 411.0,418.0 411.0,426.0" fill="#657484"/><polyline points="720,422 820,422" fill="none" stroke="#657484" stroke-width="2"/><polygon points="820.0,422.0 811.0,418.0 811.0,426.0" fill="#657484"/><rect x="713.0" y="394" width="114" height="20" rx="3" fill="#f8fafc"/><text x="770" y="409" text-anchor="middle" font-size="13" fill="#455967">eligible topic</text><polyline points="570,360 570,250" fill="none" stroke="#657484" stroke-width="2"/><polygon points="570.0,250.0 566.0,259.0 574.0,259.0" fill="#657484"/><rect x="582.5" y="284" width="177" height="20" rx="3" fill="#f8fafc"/><text x="671" y="299" text-anchor="middle" font-size="13" fill="#455967">life records as context</text><rect x="40" y="125" width="300" height="125" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="58" y="155" font-size="18" font-weight="700" fill="#172b3a">Sourced past</text><text x="58" y="181" font-size="14" fill="#354c5b">Dialogue originals / notes / profile</text><text x="58" y="204" font-size="14" fill="#354c5b">Scene visits / topics / event stages</text><text x="58" y="227" font-size="14" fill="#354c5b">Preserve who said what and when</text><rect x="420" y="125" width="300" height="125" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="438" y="155" font-size="18" font-weight="700" fill="#172b3a">StoryCore</text><text x="438" y="181" font-size="14" fill="#354c5b">Query relevant sources</text><text x="438" y="204" font-size="14" fill="#354c5b">Deduplicate and render</text><text x="438" y="227" font-size="14" fill="#354c5b">→ story_context for this turn</text><rect x="820" y="125" width="340" height="125" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="838" y="155" font-size="18" font-weight="700" fill="#172b3a">Editor → Writer</text><text x="838" y="181" font-size="14" fill="#354c5b">Current facts stay authoritative</text><text x="838" y="204" font-size="14" fill="#354c5b">History is scoped background</text><text x="838" y="227" font-size="14" fill="#354c5b">Do not treat proposals as complete</text><rect x="40" y="360" width="300" height="125" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="58" y="390" font-size="18" font-weight="700" fill="#172b3a">Calendar + event drafts</text><text x="58" y="416" font-size="14" fill="#354c5b">Daily schedule lookup</text><text x="58" y="439" font-size="14" fill="#354c5b">Registered scenes / outfits</text><text x="58" y="462" font-size="14" fill="#354c5b">Drafts are not completed events</text><rect x="420" y="360" width="300" height="125" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="438" y="390" font-size="18" font-weight="700" fill="#172b3a">Life subsystem</text><text x="438" y="416" font-size="14" fill="#354c5b">Clock / travel / event progression</text><text x="438" y="439" font-size="14" fill="#354c5b">Optional local-model event step</text><text x="438" y="462" font-size="14" fill="#354c5b">Verified fictional life ledger</text><rect x="820" y="360" width="340" height="125" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="838" y="390" font-size="18" font-weight="700" fill="#172b3a">Proactive selection</text><text x="838" y="416" font-size="14" fill="#354c5b">Quiet hours / cooldown / movement</text><text x="838" y="439" font-size="14" fill="#354c5b">Decision core chooses a candidate</text><text x="838" y="462" font-size="14" fill="#354c5b">Editor → proactive Writer</text><text x="40" y="550" font-size="14" fill="#566879">User-originated topics can cross scenes. A change of scene does not make the conversation history disappear.</text><text x="40" y="582" font-size="14" fill="#566879">Life progression alone does not send a message. Proactive delivery also needs a selected action and contact gates.</text><text x="40" y="614" font-size="14" fill="#566879">For the demo world, daily schedules are table-driven; a different configured world can use model planning.</text><text x="40" y="662" font-size="14" fill="#566879">Neither subsystem may silently move the user. Formal facts are committed through the state / journey machinery.</text></g></svg>