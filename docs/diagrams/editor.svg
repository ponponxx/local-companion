<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">The Editor is a bounded handoff</title><desc id="desc">A function group, not an extra LLM or a second judge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657484"/></marker></defs><rect width="1240" height="760" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#172b3a">The Editor is a bounded handoff</text><text x="40" y="80" font-size="15" fill="#566879">A function group, not an extra LLM or a second judge.</text><polyline points="320,175 355,175 355,275 410,275" fill="none" stroke="#657484" stroke-width="2"/><polygon points="410.0,275.0 401.0,271.0 401.0,279.0" fill="#657484"/><polyline points="320,310 410,310" fill="none" stroke="#657484" stroke-width="2"/><polygon points="410.0,310.0 401.0,306.0 401.0,314.0" fill="#657484"/><polyline points="320,445 355,445 355,345 410,345" fill="none" stroke="#657484" stroke-width="2"/><polygon points="410.0,345.0 401.0,341.0 401.0,349.0" fill="#657484"/><polyline points="770,310 870,310" fill="none" stroke="#657484" stroke-width="2"/><polygon points="870.0,310.0 861.0,306.0 861.0,314.0" fill="#657484"/><rect x="763.0" y="279" width="114" height="20" rx="3" fill="#f8fafc"/><text x="820" y="294" text-anchor="middle" font-size="13" fill="#455967">final messages</text><polyline points="590,385 590,510" fill="none" stroke="#657484" stroke-width="2"/><polygon points="590.0,510.0 594.0,501.0 586.0,501.0" fill="#657484"/><rect x="608.5" y="437" width="93" height="20" rx="3" fill="#f8fafc"/><text x="655" y="452" text-anchor="middle" font-size="13" fill="#455967">record only</text><rect x="40" y="125" width="280" height="100" rx="12" fill="#fff3dc" stroke="#c29546" stroke-width="1.5"/><text x="58" y="155" font-size="18" font-weight="700" fill="#172b3a">Identity + current facts</text><text x="58" y="181" font-size="14" fill="#354c5b">Who is speaking / to whom</text><text x="58" y="204" font-size="14" fill="#354c5b">Time, scene, appearance if relevant</text><rect x="40" y="260" width="280" height="100" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="58" y="290" font-size="18" font-weight="700" fill="#172b3a">Decision + delivery</text><text x="58" y="316" font-size="14" fill="#354c5b">Action / response outline</text><text x="58" y="339" font-size="14" fill="#354c5b">Natural-language tone instructions</text><rect x="40" y="395" width="280" height="100" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="58" y="425" font-size="18" font-weight="700" fill="#172b3a">Selected context</text><text x="58" y="451" font-size="14" fill="#354c5b">Recent original dialogue</text><text x="58" y="474" font-size="14" fill="#354c5b">StoryCore packet / approved source</text><rect x="410" y="235" width="360" height="150" rx="12" fill="#e8f6ef" stroke="#459b78" stroke-width="1.5"/><text x="428" y="265" font-size="18" font-weight="700" fill="#172b3a">Editor / context assembly</text><text x="428" y="291" font-size="14" fill="#354c5b">Compile the chosen-action brief</text><text x="428" y="314" font-size="14" fill="#354c5b">Finish and project the contract</text><text x="428" y="337" font-size="14" fill="#354c5b">Count tokens; select bounded context</text><text x="428" y="360" font-size="14" fill="#354c5b">→ system + recent role messages</text><rect x="870" y="235" width="300" height="150" rx="12" fill="#e8efff" stroke="#667bd4" stroke-width="1.5"/><text x="888" y="265" font-size="18" font-weight="700" fill="#172b3a">Writer</text><text x="888" y="291" font-size="14" fill="#354c5b">Read the final messages</text><text x="888" y="314" font-size="14" fill="#354c5b">Write the character reply</text><text x="888" y="337" font-size="14" fill="#354c5b">No raw score-table reassessment</text><text x="888" y="360" font-size="14" fill="#354c5b">Semantic accuracy is not guaranteed</text><rect x="410" y="510" width="360" height="105" rx="12" fill="#f0edf7" stroke="#9b85b7" stroke-width="1.5"/><text x="428" y="540" font-size="18" font-weight="700" fill="#172b3a">Diagnostics inspector</text><text x="428" y="566" font-size="14" fill="#354c5b">Observer request / raw output</text><text x="428" y="589" font-size="14" fill="#354c5b">Same-run Writer Prompt</text><text x="40" y="665" font-size="14" fill="#566879">Identity/background belongs in the character definition. Tone comes from delivery rules, not duplicated persona prose.</text><text x="40" y="695" font-size="14" fill="#566879">Memory source identifiers stay in backend audit records. Necessary context that still exceeds the budget can stop a turn.</text><text x="40" y="724" font-size="14" fill="#566879">The inspector reads diagnostics; it cannot become a second source of character memory.</text></g></svg>