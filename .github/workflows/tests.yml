name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --python 3.12 --locked
      - run: uv run python -m unittest discover -s test -p 'test_*.py'
      - run: uv run python scripts/check_public.py
