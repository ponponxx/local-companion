<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt 檢視室</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="eyebrow">LOCAL COMPANION · READ ONLY</span><h1>Prompt 檢視室<span id="demo"></span></h1><p>同一輪的事件判讀輸入、判讀輸出與 Writer Prompt。僅整理顯示，不修改模型或記憶。</p></div><div class="sync"><span id="status">連線中…</span><button id="refresh">重新整理</button></div></header>
<div class="toolbar"><div class="group"><label for="source">內容</label><select id="source"><option value="turn" selected>每輪對話 · 三份資料</option><option value="text">最近文字 Prompt</option><option value="latest">最近生成（文字／圖片）</option></select></div><div class="group modes" aria-label="顯示模式"><button data-mode="read" class="active">閱讀版</button><button data-mode="json">格式化 JSON</button><button data-mode="raw">原始封存</button></div><div class="actions"><button id="copy">複製原始資料</button><button id="download">下載原始檔</button></div></div>
<div id="turn-tools" class="turn-tools"><label for="turn">對話</label><select id="turn"><option value="latest">最新一輪</option></select><label for="attempt">判讀嘗試</label><select id="attempt"></select><span id="turn-info"></span></div>
<div id="stage-tabs" class="phase-tabs"><button data-stage="observer_input" class="active">① 首次判讀 · 輸入</button><button data-stage="observer_output">② 首次判讀 · 輸出</button><button data-stage="writer_input">③ Writer · Prompt</button></div>
<div class="notice" id="notice" role="status">閱讀版會拆開 content 裡的結構化資料；原始封存保留完整跳脫字元，可用來核對實際請求。</div>
<div class="layout"><aside><div class="aside-heading">本輪內容</div><nav id="nav"></nav><div class="aside-foot">每 3 秒檢查更新<br>只在本機開放</div></aside><main id="content"><div class="empty">正在讀取封存資料…</div></main></div><div id="toast" role="status"></div></body></html>
